name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ZipHereSetup.exe
        shell: cmd
        run: call build.bat nopause

      - name: SHA-256 checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\ZipHereSetup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  ZipHereSetup.exe" | Out-File -Encoding ascii dist\ZipHereSetup.exe.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZipHereSetup
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
